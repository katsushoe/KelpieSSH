services:
  demo-vps:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEMO_USER: ${KELPIE_DEMO_USER:-kelpie}
        DEMO_PASSWORD: ${KELPIE_DEMO_PASSWORD:-kelpie-demo}
    image: kelpie-demo-vps:latest
    container_name: kelpie-demo-vps
    ports:
      - "127.0.0.1:${KELPIE_DEMO_SSH_PORT:-2222}:22"
    environment:
      DEMO_USER: ${KELPIE_DEMO_USER:-kelpie}
      DEMO_PASSWORD: ${KELPIE_DEMO_PASSWORD:-kelpie-demo}
    restart: unless-stopped
